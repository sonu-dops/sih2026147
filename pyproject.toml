[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalinsight"
version = "1.0.0"
description = "Automated IQ/WAV Signal Analysis, Parameter Extraction & Modulation Classification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SignalInsight Engineering Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "pyqt6>=6.5.0",
    "pyqtgraph>=0.13.3",
    "pyopengl>=3.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "reportlab>=4.0.0",
    "pytest>=7.4.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
signalinsight = "signalinsight.main:main"
